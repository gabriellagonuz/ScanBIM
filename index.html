<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanBIM - Inteligencia Artificial para Ingeniería y Arquitectura</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script>
        function changeLanguage(lang) {
            const elements = document.querySelectorAll("[data-lang]");
            elements.forEach(element => {
                element.innerHTML = translations[lang][element.getAttribute("data-lang")];
            });
        }
        
        const translations = {
            "es": {
                "title": "Transforma tu flujo de trabajo con ScanBIM",
                "subtitle": "El software líder en integración BIM con Inteligencia Artificial",
                "download": "Descargar Versión Gratuita",
                "explore": "Explorar Planes",
                "inicio": "Inicio",
                "productos": "Productos",
                "soporte": "Soporte",
                "contacto": "Contacto"
            },
            "en": {
                "title": "Transform your workflow with ScanBIM",
                "subtitle": "The leading software for BIM integration with Artificial Intelligence",
                "download": "Download Free Version",
                "explore": "Explore Plans",
                "inicio": "Home",
                "productos": "Products",
                "soporte": "Support",
                "contacto": "Contact"
            }
        };
    </script>
</head>
<body>
    <header>
        <img src="logo.png" alt="ScanBIM Logo">
        <nav class="menu">
            <a href="#" data-lang="inicio">Inicio</a>
            <a href="#" data-lang="productos">Productos</a>
            <a href="#" data-lang="soporte">Soporte</a>
            <a href="#" data-lang="contacto">Contacto</a>
        </nav>
        <div class="language-selector">
            <button onclick="changeLanguage('es')">🇪🇸 ES</button>
            <button onclick="changeLanguage('en')">🇺🇸 EN</button>
        </div>
    </header>
    
    <section class="hero">
        <h1 data-lang="title">Transforma tu flujo de trabajo con ScanBIM</h1>
        <p data-lang="subtitle">El software líder en integración BIM con Inteligencia Artificial</p>
        <a href="#" class="cta-button" data-lang="download">Descargar Versión Gratuita</a>
        <a href="#" class="cta-button" data-lang="explore">Explorar Planes</a>
    </section>
    
    <div class="footer">
        <p>© 2024 ScanBIM. Todos los derechos reservados.</p>
    </div>
</body>
</html>
